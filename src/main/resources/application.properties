spring.application.name=StriptKillGameDemo2
spring.profiles.active=dev

# ===================== MongoDB config =====================
spring.data.mongodb.uri=mongodb://localhost:27017/stript_kill_game

# ===================== Redis config =======================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000

# ===================== JWT config =========================
jwt.secret=c3RyaXB0LWtpbGwtZ2FtZS1kZW1vMi1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNg==
jwt.access-token-expiration=7200
jwt.refresh-token-expiration=2592000

# ===================== game controller ====================
game.script.generate.number=8

# Spring AI - Anthropic (switch provider by changing starter + prefix)
spring.ai.anthropic.api-key=090147fd-012f-49c5-9b25-ea6dc1aa8e19
spring.ai.anthropic.chat.options.model=minimax-m2.5
spring.ai.anthropic.base-url=https://ark.cn-beijing.volces.com/api/coding
spring.ai.anthropic.chat.options.max-tokens=4096

# Game AI engine
game.ai.chars-per-token=3.5
game.ai.token-threshold-ratio=0.7
game.ai.max-context-tokens=100000
game.ai.sliding-window-size=20
game.ai.turn-timeout-seconds=60
game.ai.vote-timeout-seconds=120
game.ai.free-chat-timeout-seconds=300
game.ai.max-ai-chat-rounds=3
game.ai.idle-timeout-seconds=60